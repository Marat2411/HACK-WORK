<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Халтурка.ру</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #FAFAFA;
            color: #333333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Шапка - КАК В INDEX.HTML */
        .header {
            background-color: #FAFAFA;
            padding: 1rem 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
            border-bottom: 1px solid #EEEEEE;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform: translateY(0);
        }

        .header.hidden {
            transform: translateY(-100%);
        }

        .header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #FF8C00;
            text-decoration: none;
        }

        .main-nav {
            display: flex;
            gap: 1.5rem;
        }

        .nav-link {
            color: #333333;
            text-decoration: none;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 0;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            position: relative;
            background-color: transparent !important;
            width: 130px;
            height: 45px;
            justify-content: center;
            flex-shrink: 0;
        }

        .nav-text {
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            transform-origin: center;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 3px;
            background: linear-gradient(135deg, #FFD166, #FFA94D);
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        .nav-link:hover .nav-text,
        .nav-link.active .nav-text {
            transform: scale(1.1);
        }

        .nav-link:hover::after,
        .nav-link.active::after {
            width: 90%;
        }

        .nav-link.active {
            font-weight: 700;
        }

        /* Мобильная кнопка меню - КАК В INDEX.HTML */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            color: #FF8C00;
            cursor: pointer;
            padding: 5px;
        }

        /* Основной контент */
        .main-content {
            padding: 7rem 0 3rem;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 1.5rem;
            color: #333333;
            font-weight: 800;
            text-align: center;
        }

        .page-description {
            color: #666666;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #EEEEEE;
            font-size: 1.2rem;
            text-align: center;
        }

        /* Контейнер формы */
        .auth-container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        .auth-box {
            background: #FFFFFF;
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #EEEEEE;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.6rem;
            font-weight: 600;
            color: #444444;
            font-size: 1.05rem;
        }

        .form-label i {
            color: #FFA94D;
            margin-right: 8px;
            width: 20px;
            text-align: center;
        }

        .form-control {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 1px solid #DDDDDD;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background-color: #FAFAFA;
        }

        .form-control:focus {
            outline: none;
            border-color: #FFA94D;
            box-shadow: 0 0 0 3px rgba(255, 169, 77, 0.2);
            background-color: #FFFFFF;
        }

        .form-hint {
            font-size: 0.9rem;
            color: #777777;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .form-hint i {
            color: #FFA94D;
        }

        /* Кнопка входа */
        .auth-button {
            width: 100%;
            padding: 1rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 1.5rem;
            background: linear-gradient(135deg, #7ED957, #A8E6CF);
            color: #2E7D32;
            box-shadow: 0 2px 8px rgba(126, 217, 87, 0.3);
        }

        .auth-button:hover {
            background: linear-gradient(135deg, #5ECF4D, #97D9B4);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(94, 207, 77, 0.4);
            color: #1B5E20;
        }

        .auth-button i {
            font-size: 1.2rem;
        }

        /* Ссылки */
        .auth-links {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #EEEEEE;
        }

        .auth-link {
            color: #FF8C00;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .auth-link:hover {
            color: #FFA94D;
            transform: translateY(-2px);
        }

        /* Подвал - идентичный другим страницам */
        .footer {
            background-color: #FAFAFA;
            color: #333333;
            padding: 3rem 0;
            margin-top: auto;
            text-align: center;
            border-top: 1px solid #EEEEEE;
        }

        .footer .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .footer p {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .footer-email {
            font-size: 1.2rem;
            color: #FF8C00;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .footer-email:hover {
            color: #FF8C00;
            transform: translateY(-2px);
        }

        .footer-email i {
            font-size: 1.4rem;
        }

        /* Переключатель видимости пароля */
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #777777;
            cursor: pointer;
        }

        .password-container {
            position: relative;
        }

        /* АДАПТИВНОСТЬ КАК В INDEX.HTML */
        @media (max-width: 768px) {
            .mobile-menu-btn {
                display: block;
            }
            
            .main-nav {
                position: fixed;
                top: 70px;
                left: 0;
                width: 100%;
                background: #FAFAFA;
                flex-direction: column;
                padding: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
                transform: translateY(-150%);
                transition: transform 0.3s;
                z-index: 999;
                gap: 0;
            }
            
            .main-nav.active {
                transform: translateY(0);
            }
            
            .nav-link {
                padding: 12px 0;
                justify-content: center;
                width: 100%;
                height: auto;
                border-bottom: 1px solid #EEEEEE;
            }
            
            .nav-link:last-child {
                border-bottom: none;
            }
            
            .nav-text {
                justify-content: center;
            }
            
            .auth-box {
                padding: 2rem;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .logo {
                font-size: 1.6rem;
            }
            
            .main-content {
                padding: 5rem 0 2rem;
            }
            
            .auth-links {
                flex-direction: column;
                gap: 1rem;
                align-items: center;
            }
            
            .footer-email {
                font-size: 1rem;
            }
        }
        
        @media (max-width: 480px) {
            .auth-box {
                padding: 1.5rem;
            }
            
            .nav-link {
                font-size: 0.9rem;
            }
            
            .form-control {
                padding: 0.8rem 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Шапка КАК В INDEX.HTML -->
    <header class="header" id="mainHeader">
        <div class="container">
            <a href="/" class="logo">
                Халтурка.ру
            </a>
            
            <!-- Кнопка мобильного меню -->
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="fas fa-bars"></i>
            </button>
            
            <!-- Навигация КАК В INDEX.HTML -->
            <nav class="main-nav" id="mainNav">
                <a href="/" class="nav-link">
                    <span class="nav-text">
                        <i class="fas fa-home"></i> Главная
                    </span>
                </a>
                <a href="#" class="nav-link">
                    <span class="nav-text">
                        <i class="fas fa-wallet"></i> Баланс
                    </span>
                </a>
                <a href="auth.html" class="nav-link active">
                    <span class="nav-text">
                        <i class="fas fa-sign-in-alt"></i> Войти
                    </span>
                </a>
            </nav>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="container main-content">
        <div class="auth-container">
            <h1>Вход в личный кабинет</h1>
            <p class="page-description">Войдите, чтобы управлять заказами и получать предложения</p>
            
            <div class="auth-box">
                <!-- Форма входа -->
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="loginEmail">
                            <i class="fas fa-envelope"></i> Email или телефон
                        </label>
                        <input type="text" id="loginEmail" class="form-control" placeholder="example@mail.ru или +7 (999) 123-45-67" required>
                        <div class="form-hint">
                            <i class="fas fa-info-circle"></i> Введите email или номер телефона
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="loginPassword">
                            <i class="fas fa-lock"></i> Пароль
                        </label>
                        <div class="password-container">
                            <input type="password" id="loginPassword" class="form-control" placeholder="Введите ваш пароль" required>
                            <button type="button" class="password-toggle" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="form-hint">
                            <i class="fas fa-key"></i> Минимум 6 символов
                        </div>
                    </div>
                    
                    <button type="submit" class="auth-button">
                        <i class="fas fa-sign-in-alt"></i> Войти
                    </button>
                </form>

                <!-- Ссылки -->
                <div class="auth-links">
                    <a href="/registr/" class="auth-link">
                        <i class="fas fa-user-plus"></i> Создать аккаунт
                    </a>
                    <a href="forgot_password.html" class="auth-link">
                        <i class="fas fa-question-circle"></i> Забыли пароль?
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Подвал -->
    <footer class="footer">
        <div class="container">
            <p>© 2025 Халтурка.ру - площадка для заказов и услуг</p>
            <a href="mailto:example@mail.ru" class="footer-email">
                <i class="fas fa-envelope"></i> example@mail.ru
            </a>
        </div>
    </footer>

    <script>
        // Скрипт для автоматического скрытия/показа шапки при прокрутке - КАК В INDEX.HTML
        let lastScrollTop = 0;
        const header = document.getElementById('mainHeader');
        const scrollThreshold = 60;
        
        window.addEventListener('scroll', function() {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            if (scrollTop > lastScrollTop && scrollTop > scrollThreshold) {
                header.classList.add('hidden');
            } 
            else if (scrollTop < lastScrollTop) {
                header.classList.remove('hidden');
            }
            
            lastScrollTop = scrollTop;
        });

        // Мобильное меню - КАК В INDEX.HTML
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mainNav = document.getElementById('mainNav');
        
        if (mobileMenuBtn && mainNav) {
            mobileMenuBtn.addEventListener('click', () => {
                mainNav.classList.toggle('active');
                mobileMenuBtn.innerHTML = mainNav.classList.contains('active') 
                    ? '<i class="fas fa-times"></i>' 
                    : '<i class="fas fa-bars"></i>';
            });
            
            // Закрыть мобильное меню при клике на ссылку
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', () => {
                    mainNav.classList.remove('active');
                    mobileMenuBtn.innerHTML = '<i class="fas fa-bars"></i>';
                });
            });
        }

        // Переключение видимости пароля
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('loginPassword');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Обработка формы входа
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            // Валидация
            if (!email || !password) {
                alert('Пожалуйста, заполните все поля!');
                return;
            }
            
            if (password.length < 6) {
                alert('Пароль должен содержать минимум 6 символов');
                return;
            }
            
            // Симуляция отправки данных на сервер
            console.log('Попытка входа:', { email, password });
            
            // Показать сообщение об успехе
            alert('Вход выполнен успешно! Перенаправляем в личный кабинет...');
            
            // Перенаправление на страницу личного кабинета
            setTimeout(() => {
                window.location.href = '/personal_account/';
            }, 1500);
        });

        // Проверка сохраненных данных при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            const savedEmail = localStorage.getItem('rememberedEmail');
            if (savedEmail) {
                document.getElementById('loginEmail').value = savedEmail;
            }
        });
    </script>
</body>
</html>
